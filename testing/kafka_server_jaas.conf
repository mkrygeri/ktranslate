KafkaServer {
    com.sun.security.auth.module.Krb5LoginModule required
    useKeyTab=true
    storeKey=true
    keyTab="/etc/kafka/keytabs/kafka.service.keytab"
    principal="kafka/kafka.example.com@EXAMPLE.COM"
    useTicketCache=false;
};

Client {
    com.sun.security.auth.module.Krb5LoginModule required
    useKeyTab=true
    storeKey=true
    keyTab="/etc/kafka/keytabs/kafka.service.keytab"
    principal="kafka/kafka.example.com@EXAMPLE.COM"
    useTicketCache=false;
};
