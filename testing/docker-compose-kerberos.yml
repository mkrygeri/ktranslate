version: '3.8'

services:
  # Existing services
  kafka-zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ktranslate-net

  kafka-broker:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - kafka-zookeeper
      - kerberos-kdc
    ports:
      - "9092:9092"
      - "9093:9093"  # SASL_PLAINTEXT
      - "9094:9094"  # SASL_SSL
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: kafka-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,SASL_PLAINTEXT://0.0.0.0:9093,SASL_SSL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,SASL_PLAINTEXT://localhost:9093,SASL_SSL://localhost:9094
      KAFKA_SECURITY_INTER_BROKER_PROTOCOL: PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: GSSAPI,PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="admin-secret"
        user_admin="admin-secret"
        user_ktranslate="ktranslate-secret";
      # Kerberos configuration
      KAFKA_SASL_KERBEROS_SERVICE_NAME: kafka
      KAFKA_OPTS: -Djava.security.krb5.conf=/etc/krb5.conf
      # SSL configuration
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.server.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: kafka_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: kafka_ssl_key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.server.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: kafka_truststore_creds
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - ./ssl:/etc/kafka/secrets
      - ./kerberos/krb5.conf:/etc/krb5.conf:ro
      - ./kerberos/kafka.keytab:/etc/security/keytabs/kafka.keytab:ro
    networks:
      - ktranslate-net

  # Kerberos KDC (Key Distribution Center)
  kerberos-kdc:
    image: ubuntu:22.04
    hostname: kdc.example.com
    ports:
      - "88:88/udp"   # Kerberos KDC
      - "749:749"     # Kerberos admin
    environment:
      DEBIAN_FRONTEND: noninteractive
    volumes:
      - ./kerberos:/kerberos-setup
      - kdc-data:/var/lib/krb5kdc
    command: |
      bash -c "
        apt-get update && apt-get install -y krb5-kdc krb5-admin-server krb5-config
        
        # Configure realm
        echo 'EXAMPLE.COM' > /etc/krb5kdc/kadm5.acl
        echo '*/admin@EXAMPLE.COM *' >> /etc/krb5kdc/kadm5.acl
        
        # Initialize KDC database
        kdb5_util create -s -r EXAMPLE.COM -P masterkey123
        
        # Add principals
        kadmin.local -q 'addprinc -pw admin123 admin/admin@EXAMPLE.COM'
        kadmin.local -q 'addprinc -pw kafka123 kafka/localhost@EXAMPLE.COM'
        kadmin.local -q 'addprinc -pw ktranslate123 ktranslate@EXAMPLE.COM'
        
        # Create keytabs
        kadmin.local -q 'ktadd -k /kerberos-setup/kafka.keytab kafka/localhost@EXAMPLE.COM'
        kadmin.local -q 'ktadd -k /kerberos-setup/ktranslate.keytab ktranslate@EXAMPLE.COM'
        
        # Set proper permissions
        chmod 644 /kerberos-setup/*.keytab
        
        # Start services
        krb5kdc -n &
        kadmind -nofork
      "
    networks:
      - ktranslate-net

  # Kerberos client for testing
  kerberos-client:
    image: ubuntu:22.04
    depends_on:
      - kerberos-kdc
    volumes:
      - ./kerberos:/kerberos-setup
    environment:
      DEBIAN_FRONTEND: noninteractive
    command: |
      bash -c "
        apt-get update && apt-get install -y krb5-user
        cp /kerberos-setup/krb5.conf /etc/krb5.conf
        
        echo 'Kerberos client ready for testing'
        echo 'Test commands:'
        echo '  kinit -kt /kerberos-setup/ktranslate.keytab ktranslate@EXAMPLE.COM'
        echo '  klist'
        
        tail -f /dev/null
      "
    networks:
      - ktranslate-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka-broker
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ktranslate-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
      DYNAMIC_CONFIG_ENABLED: true
    networks:
      - ktranslate-net

volumes:
  kdc-data:

networks:
  ktranslate-net:
    driver: bridge
