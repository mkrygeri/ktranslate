sinks:
  - kafka
format: json
kafkasink:
  bootstrapservers: "localhost:9092"
  topic: "ktranslate-kerberos-test"
  securityprotocol: "SASL_PLAINTEXT"
  saslmechanism: "GSSAPI"
  saslkerberosservicename: "kafka"
  kerberosprincipal: "producer@EXAMPLE.COM"
  kerberosrealm: "EXAMPLE.COM"
  kerberosconfigpath: "/home/mikek/ktranslate/testing/krb5.conf"
  kerberoskeytabpath: "/home/mikek/ktranslate/testing/producer-example.keytab"
  compression: "gzip"
  requiredacks: 1
rollup:
  maxmemoryMB: 128
  maxkeys: 10000
  emergencycleanup: true
  topk: 20
server:
  loglevel: "debug"
  logtostdout: true
  servicename: "ktranslate-kerberos-test"
