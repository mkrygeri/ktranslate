sinks:
  - kafka
format: json
kafkasink:
  bootstrapservers: "localhost:9092"
  topic: "ktranslate-kerberos-fixed"
  securityprotocol: "SASL_PLAINTEXT"
  saslmechanism: "GSSAPI"
  kerberosservicename: "kafka"
  kerberosrealm: "EXAMPLE.COM"
  kerberosconfigpath: "/home/mikek/ktranslate/testing/kerberos/krb5.conf"
  kerberoskeytabpath: "/home/mikek/ktranslate/testing/kerberos/ktranslate.keytab"
  kerberosprincipal: "ktranslate@EXAMPLE.COM"
  compression: "gzip"
  requiredacks: 1
rollup:
  maxmemoryMB: 128
  maxkeys: 10000
  emergencycleanup: true
  topk: 20
server:
  loglevel: "debug"
  logtostdout: true
  servicename: "ktranslate-kerberos-fixed"
