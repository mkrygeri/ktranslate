# ktranslate SASL_SSL Configuration with Maximum Debug
# This demonstrates the enhanced ktranslate system with:
# 1. Cache-based rollup system (replacing HLL)
# 2. Memory and key limits with emergency cleanup  
# 3. Sarama Kafka library with full SASL_SSL security support
# 4. Complete Kerberos authentication configuration
# 5. SSL/TLS encryption with certificate validation
# 6. Maximum debugging verbosity for troubleshooting

# ============== SASL_SSL Configuration (COMPREHENSIVE) ==============
sinks:
  - kafka
format: json
kafkasink:
  bootstrapservers: "localhost:9093"
  topic: "ktranslate-sasl-ssl-comprehensive-debug"
  securityprotocol: "SASL_SSL"
  saslmechanism: "GSSAPI"
  
  # ============== Kerberos Authentication Configuration ==============
  kerberosservicename: "kafka"
  kerberosprincipal: "ktranslate@EXAMPLE.COM"
  kerberosrealm: "EXAMPLE.COM"
  kerberoskdchost: "localhost:88"
  kerberosconfigpath: "/home/mikek/ktranslate/testing/krb5.conf"
  kerberoskeytabpath: "/home/mikek/ktranslate/testing/ktranslate-debug.keytab"
  
  # ============== SSL Certificate Configuration ==============
  sslcafile: "/home/mikek/ktranslate/testing/ssl-certs/ca-cert"
  sslcertfile: "/home/mikek/ktranslate/testing/ssl-certs/kafka-server-cert-san"
  sslkeyfile: "/home/mikek/ktranslate/testing/ssl-certs/kafka-server-key"
  sslinsecure: true  # Skip verification for debug
  
  # ============== Kafka Configuration ==============
  compression: "none"  # Disable for clearer debug output
  requiredacks: 1
  debug: true
  
# ============== Cache-Based Rollup System ==============
rollup:
  maxmemoryMB: 128     # 128MB memory limit
  maxkeys: 10000       # 10K key limit
  emergencycleanup: true  # Emergency aging at 80% threshold
  topk: 20
  cacherollup: true    # Enable cache-based rollup (NEW FEATURE)

# ============== Maximum Debug Configuration ==============
server:
  loglevel: "debug"    # Maximum supported log level
  logtostdout: true
  servicename: "ktranslate-sasl-ssl-comprehensive-debug"

# ============== Enhanced Debug Environment Variables ==============
# For maximum SASL_SSL debugging, use these environment variables:
# 
# export KRB5_CONFIG=/home/mikek/ktranslate/testing/krb5.conf
# export GODEBUG=tls=1
# export KRB5_TRACE=/dev/stderr
# 
# Command Line with Maximum Debug:
# ./ktranslate \
#   -config=/home/mikek/ktranslate/testing/ktranslate-comprehensive-debug.yaml \
#   -log_level=debug \
#   -stdout \
#   -nf.source=netflow5 \
#   -nf.port=9995

# ============== Flow Input with Debug ==============
inputs:
  flow:
    enabled: true
    port: 9995
    workers: 1
    queue: 10

# ============== Infrastructure Requirements ==============
# 
# 1. Kerberos KDC Container:
#    - docker run ktranslate-kdc (port 88 UDP, 749 TCP)
#    - Principal: ktranslate@EXAMPLE.COM
#    - Keytab: /home/mikek/ktranslate/testing/ktranslate-debug.keytab
#    - Config: /home/mikek/ktranslate/testing/krb5.conf
#
# 2. SASL_SSL Kafka Broker:
#    - Supports both GSSAPI (Kerberos) and SSL simultaneously
#    - SSL certificates with proper SAN (DNS:localhost, IP:127.0.0.1)
#    - JAAS configuration for Kerberos authentication
#
# 3. SSL Certificates:
#    - CA certificate: /home/mikek/ktranslate/testing/ssl-certs/ca-cert
#    - Server cert: /home/mikek/ktranslate/testing/ssl-certs/kafka-server-cert-san
#    - Private key: /home/mikek/ktranslate/testing/ssl-certs/kafka-server-key
#
# 4. Test Kerberos Authentication:
#    export KRB5_CONFIG=/home/mikek/ktranslate/testing/krb5.conf
#    kinit -kt /home/mikek/ktranslate/testing/ktranslate-debug.keytab ktranslate@EXAMPLE.COM
#    klist  # Verify ticket cache