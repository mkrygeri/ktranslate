# ktranslate SASL_SSL Configuration (Infrastructure Ready)
# This demonstrates the complete SASL_SSL configuration with Kerberos
# Ready for use when SASL_SSL Kafka broker is available

sinks:
  - kafka
format: json
kafkasink:
  bootstrapservers: "localhost:9093"
  topic: "ktranslate-sasl-ssl-comprehensive"
  securityprotocol: "SASL_SSL"
  saslmechanism: "GSSAPI"
  
  # ============== Kerberos Authentication ==============
  kerberosservicename: "kafka"
  kerberosprincipal: "ktranslate@EXAMPLE.COM"
  kerberosrealm: "EXAMPLE.COM"
  kerberoskdchost: "localhost:88"
  kerberosconfigpath: "/home/mikek/ktranslate/testing/krb5.conf"
  kerberoskeytabpath: "/home/mikek/ktranslate/testing/ktranslate-debug.keytab"
  
  # ============== SSL/TLS Encryption ==============
  sslcafile: "/home/mikek/ktranslate/testing/ssl-certs/ca-cert"
  sslcertfile: "/home/mikek/ktranslate/testing/ssl-certs/kafka-server-cert-san"
  sslkeyfile: "/home/mikek/ktranslate/testing/ssl-certs/kafka-server-key"
  sslinsecure: true  # For debugging
  
  # ============== Debug Configuration ==============
  compression: "none"
  requiredacks: 1
  debug: true

# ============== Cache Rollup with Memory Management ==============
rollup:
  maxmemoryMB: 128
  maxkeys: 10000
  emergencycleanup: true
  topk: 20
  cacherollup: true

# ============== Maximum Verbosity ==============
server:
  loglevel: "debug"
  logtostdout: true
  servicename: "ktranslate-sasl-ssl-comprehensive"

# Environment Variables for Maximum Debug:
# export KRB5_CONFIG=/home/mikek/ktranslate/testing/krb5.conf
# export GODEBUG=tls=1
# export KRB5_TRACE=/dev/stderr
#
# Command Line:
# ./ktranslate -config=this_file.yaml -log_level=debug -stdout -nf.source=netflow5 -nf.port=9995